# SomnoLens, light installation: every tool, with YASA alone for the automatic scoring of tool 3bis.
# The full installation (GSSC and SleepFM in tool 3bis) is environment-full.yml, the developers' one environment-dev.yml:
# each repeats this list (conda has no include), tests/test_environment_files.py checks that they agree.
# Versions pinned, refreshed deliberately between two studies (SPEC.md, Conda environment). Last refresh: 2026-11-19.
name: somnolens
channels:
  - conda-forge
dependencies:
  - python=3.14.*
  - numpy=2.5.*
  - libblas=*=*openblas   # not MKL: MKL 2026 with llvm-openmp crashes every matrix product on Windows (SPEC.md)
  - pandas=2.3.*
  - scipy=1.18.*
  - mne-base=1.13.*
  - matplotlib-base=3.11.*
  - yasa=0.8.*
  - antropy=0.1.9     # YASA's sleep staging: its classifiers were trained with antropy < 0.2 (SPEC §3bis)
  - lspopt=1.4.*      # tool 6's multitaper hypnospectrograms
  - statsmodels=0.15.*
  - scikit-learn=1.9.*
  - joblib=1.6.*
  - edfio=0.4.*
  - chardet=5.2.*     # not 7: its confidence on latin-1 / cp1252 headers falls to 0.01-0.04 (tool 1 would refuse them)
  - openpyxl=3.1.*
  - voila=0.5.*
  - ipywidgets=8.1.*
  - ipyfilechooser=0.6.*
  - ipyevents=2.0.*
  - ipykernel=6.31.*  # not 7 yet: tests/nbdriver.py and the planned Stop button depend on the kernel's event loop
  - ipython=9.*
  - tk=8.6.*          # tool 1's batch scripts (folder dialog)
  - pip
  - pip:
    - specparam==2.0.0rc7
    - curryreader==0.1.2   # MNE's reader of Curry recordings
